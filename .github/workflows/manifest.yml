name: Manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned hub ref (never `main`): a later hub change cannot break this gate
  # unannounced. Bump it deliberately to adopt a newer contract.
  HUB_REF: a334f02d3c82a11c5cf93b345acfde740b1e0d53

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the hub manifest schema at the pinned ref
        run: |
          curl -fsSL -o node-manifest.schema.json \
            "https://raw.githubusercontent.com/renewvan/hub/${HUB_REF}/schema/node-manifest.schema.json"

      - name: Validate manifest.json
        run: npx --yes ajv-cli@5 validate -s node-manifest.schema.json -d manifest.json

      - name: Gate rejects a manifest that contains version
        run: |
          jq '. + {version: "v0.0.0"}' manifest.json > manifest-with-version.json
          if npx --yes ajv-cli@5 validate -s node-manifest.schema.json -d manifest-with-version.json; then
            echo "gate accepted a manifest containing version" >&2
            exit 1
          fi
