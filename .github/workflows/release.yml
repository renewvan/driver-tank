name: Release

# Start a release from the Actions tab or `gh workflow run release.yml -f bump=minor`.
# The process lives in renewvan/hub (docs/adr/0015); this file only says what this repo ships.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest release's version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version (e.g. 0.2.0 or 0.2.0-beta.1); overrides "bump"'
        type: string
        required: false
      prerelease:
        description: 'Pre-release (a beta from a feature branch): tests gate it, `main` and `:latest` stay untouched'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: renewvan/hub/.github/workflows/release.yml@51af8a3e8bb644368be08883938c5043a550b4d9
    with:
      kind: image
      image: driver-tank
      device-version-arg: true
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      python-version: "3.12"
      test-command: pip install -r requirements.txt -r requirements-test.txt && pytest tests/ -v --tb=short
