; renewvan-tank — ADS1115 tank driver configuration
; ====================================================
; This file ships with the package and contains ALL available settings
; with safe defaults. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[i2c]
; I2C bus number — typically 1 on Raspberry Pi (/dev/i2c-1)
bus = 1
; ADS1115 I2C address — 0x48 when ADDR is tied to GND
address = 0x48
; Supply voltage feeding the voltage-divider pull-up resistor.
; Raspberry Pi GPIO header is 3.3V — never wire the ADS1115 to 5V.
reference_voltage = 3.3

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = renewvan-tank
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

; ---------------------------------------------------------------------------
; [tank.<id>] — one section per physical sender. <id> becomes the
; van/tank/<id>/... topic path segment.
;
; Wiring: 3.3V -- [fixed_resistor] -- ADC channel -- [sender] -- GND
; ---------------------------------------------------------------------------
[tank.fresh]
enabled         = true
name            = Fresh Water Tank
channel         = 0
fixed_resistor  = 220
; Resistance (ohm) at EMPTY / FULL. European standard: 0/180. US: 240/30.
sensor_min      = 0.0
sensor_max      = 190.0
capacity_l      = 70
fluid_type      = fresh_water
update_interval_ms = 3000
; Optional piecewise tank-shape correction: "sensorPct:volumePct,..."
; shape         =

[tank.grey]
enabled         = true
name            = Grey Water Tank
channel         = 1
fixed_resistor  = 220
sensor_min      = 0.0
sensor_max      = 190.0
capacity_l      = 70
fluid_type      = grey_water
update_interval_ms = 3000
