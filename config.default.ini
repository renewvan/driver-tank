; node-tank — ADS1115 tank node configuration
; ====================================================
; This file ships with the package and contains ALL available settings
; with safe defaults. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[i2c]
; I2C bus number — typically 1 on Raspberry Pi (/dev/i2c-1)
bus = 1
; ADS1115 I2C address — 0x48 when ADDR is tied to GND
address = 0x48
; Supply voltage feeding the voltage-divider pull-up resistor.
; Raspberry Pi GPIO header is 3.3V — never wire the ADS1115 to 5V.
reference_voltage = 3.3

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = node-tank
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

; ---------------------------------------------------------------------------
; [tank.<id>] — one section per physical sender. <id> becomes the
; renewvan/tank/<id>/... topic path segment.
;
; VOLUME CONFIGURATION (ticket 03):
; Replace old capacity_l with tank_capacity + volume_unit pair.
; Supported units: liters (l, litres), cubic_meters (m3, m³),
; gallons_us (us_gallons), gallons_imp (gallons_imperial, imp_gallons).
; Conversion to liters happens at load time; schema always publishes liters.
;
; ADS1115 WIRING:
; 3.3V -- [fixed_resistor] -- ADC channel -- [sender] -- GND
;
; ALARM CONFIGURATION (ticket 02, optional):
; alarm_direction: low (fresh tank refill warning) or high (grey tank overflow warning)
; alarm_threshold: level % that triggers alarm
; alarm_restore: level % that clears alarm (creates hysteresis)
; alarm_delay_s: seconds to wait after threshold crossed (optional, default 0)
; Sensor faults (open_circuit/short_circuit) force alarm_state=alarm immediately.
;
; TEMPERATURE CONFIGURATION (ntc-temperature-sensor effort, optional):
; Water temperature comes from an NTC 10k thermistor wired as a voltage
; divider on a spare ADS1115 channel -- no 1-Wire/DS18B20 support anymore.
; temp_channel: ADS1115 channel (0-3) for the tank's divider. Convention:
; pairs with the level channel (A0 level -> A2 temp, A1 -> A3).
; Omit temp_channel to disable temperature_c for the tank.
; temp_ntc_nominal_ohm: thermistor resistance at 25C (default 10000)
; temp_ntc_beta: B-value from datasheet/listing (default 3950, generic 10k)
; temp_ntc_fixed_resistor_ohm: the other divider leg (default 10000)
; temp_ntc_thermistor_low_side: true = fixed R to 3.3V, thermistor to GND
;   (default true). If unsure, warm the thermistor with a finger: tap
;   voltage FALLS when low-side, RISES when high-side.
;
; FULL/EMPTY TIMESTAMP + VOLUME TRACKING (flow-rate-full-empty-telemetry
; ticket 02, optional tuning; renamed from *_date to *_at, and
; volume_since_full_l/volume_since_empty_l added, volume-timestamp-telemetry
; tickets 01/02):
; last_full_at/last_empty_at and volume_since_full_l/volume_since_empty_l are
; always published for every tank; these two keys only tune sensitivity.
; Auto-detection reuses alarm_delay_s above as its sustain period (no
; separate delay config). volume_since_full_l/volume_since_empty_l measure
; liters moved since the level_pct last crossed these same thresholds --
; one definition of "full"/"empty" drives both the timestamp and the volume.
; full_threshold_pct: level_pct at/above which the tank counts as "full" (default 99)
; empty_threshold_pct: level_pct at/below which the tank counts as "empty" (default 1)
; ---------------------------------------------------------------------------
[tank.fresh]
enabled         = true
name            = Fresh Water Tank
channel         = 0
fixed_resistor  = 220
; Resistance (ohm) at EMPTY / FULL. European standard: 0/180. US: 240/30.
sensor_min      = 0.0
sensor_max      = 190.0
tank_capacity   = 70
volume_unit     = liters
fluid_type      = fresh_water
update_interval_ms = 3000
; Alarm: low-level warning when below 27%, clears at 48%
alarm_direction = low
alarm_threshold = 28
alarm_restore   = 70
alarm_delay_s   = 0
full_threshold_pct  = 99
empty_threshold_pct = 1
; NTC temp divider channel (optional; omit if none wired)
; temp_channel = 2
; Optional piecewise tank-shape correction: "sensorPct:volumePct,..."
; shape         =

[tank.grey]
enabled         = true
name            = Grey Water Tank
channel         = 1
fixed_resistor  = 220
sensor_min      = 0.0
sensor_max      = 190.0
tank_capacity   = 70
volume_unit     = liters
fluid_type      = grey_water
update_interval_ms = 3000
; Alarm: high-level warning when above 90%, clears at 80%
alarm_direction = high
alarm_threshold = 90
alarm_restore   = 80
alarm_delay_s   = 0
full_threshold_pct  = 99
empty_threshold_pct = 1
; NTC temp divider channel (optional; omit if none wired)
; temp_channel = 3
