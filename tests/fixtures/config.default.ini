[i2c]
bus = 1
address = 0x48
reference_voltage = 3.3

[mqtt]
host = localhost
port = 1883
client_id = node-tank

[tank.fresh]
enabled = true
name = Fresh Water Tank
channel = 0
fixed_resistor = 220
sensor_min = 0.0
sensor_max = 190.0
tank_capacity = 70
volume_unit = liters
fluid_type = fresh_water
update_interval_ms = 3000
alarm_direction = low
alarm_threshold = 20
alarm_restore = 25
alarm_delay_s = 0

[tank.grey]
enabled = true
name = Grey Water Tank
channel = 1
fixed_resistor = 220
sensor_min = 0.0
sensor_max = 190.0
tank_capacity = 70
volume_unit = liters
fluid_type = grey_water
update_interval_ms = 3000
alarm_direction = high
alarm_threshold = 90
alarm_restore = 80
alarm_delay_s = 0

[tank.disabled_extra]
enabled = false
name = Fuel Tank
channel = 2
fixed_resistor = 220
sensor_min = 0.0
sensor_max = 190.0
tank_capacity = 50
volume_unit = liters
fluid_type = fuel
update_interval_ms = 3000
