[project]
name = "renewvan-tank"
version = "0.1.0"
description = "Native MQTT driver for ADS1115-based resistive tank senders"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
    "smbus2>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renewvan_tank*"]
